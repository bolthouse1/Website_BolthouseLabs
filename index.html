<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolthouse Labs</title>
  <meta name="description" content="Bolthouse Labs — Coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508;
      --text: #e8e6ea;
      --muted: #8a8790;
      --accent: #00d4ff;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      color: var(--muted);
    }
    .logo .accent { color: var(--accent); }
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.2;
      margin-bottom: 1.25rem;
      max-width: 18ch;
    }
    p.tagline {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.05em;
      margin-bottom: 3rem;
    }
    form {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 420px;
      flex-wrap: wrap;
      justify-content: center;
    }
    input[type="email"] {
      flex: 1 1 220px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #050508;
      border: none;
      padding: 0.85rem 1.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .success {
      color: var(--accent);
      font-size: 0.95rem;
      display: none;
    }
    .success.visible { display: block; }
    form.hidden { display: none; }
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="logo"><span class="accent">Bolthouse</span> Labs</div>
  <h1>Something new is coming.</h1>
  <p class="tagline">Join the waitlist to be the first to know.</p>

  <form id="waitlist" action="https://formspree.io/f/xykbbnql" method="POST">
    <input type="email" name="email" placeholder="your@email.com" required />
    <button type="submit">Notify Me</button>
  </form>
  <div class="success" id="success">Thanks — you're on the list.</div>

  <footer>&copy; 2026 Bolthouse Labs, Inc.</footer>

  <script>
    const form = document.getElementById('waitlist');
    const success = document.getElementById('success');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.classList.add('hidden');
          success.classList.add('visible');
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
